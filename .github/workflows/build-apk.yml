name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Sheet URL and token come from repo secrets (Settings > Secrets and variables > Actions).
      - name: Write local.properties
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: |
          printf 'sheet.url=%s\nsheet.token=%s\n' "$SHEET_URL" "$SHEET_TOKEN" > local.properties

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
